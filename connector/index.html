<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <title>Tally AI Connector</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        user-select: none;
      }
      .shell {
        padding: 24px;
      }
      .card {
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.9);
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }
      .label {
        display: block;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #93c5fd;
      }
      .field {
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: #fff;
        color: #0f172a;
        padding: 12px 16px;
        font-size: 14px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s;
      }
      .field:focus {
        border-color: #2563eb;
      }
      .button {
        border: none;
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }
      .button:active {
        transform: scale(0.98);
      }
      .primary {
        background: #2563eb;
        color: white;
      }
      .secondary {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .row {
        display: grid;
        gap: 16px;
      }
      .status {
        display: grid;
        gap: 10px;
        margin-top: 20px;
        font-size: 13px;
        color: #cbd5e1;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        width: fit-content;
        font-family: monospace;
      }
      #message {
        min-height: 20px;
        font-size: 13px;
        color: #fca5a5;
        margin-top: 8px;
      }
      .success-text {
        color: #4ade80 !important;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #93c5fd;">Tally AI Connector</div>
        <h1 id="main-title" style="margin: 12px 0 8px; font-size: 24px; line-height: 1.2;">Pair this Windows PC</h1>
        <p id="main-desc" style="margin: 0 0 24px; color: #94a3b8; font-size: 13px; line-height: 1.6;">
          Enter the backend URL and the 6-digit pairing code from the website.
        </p>

        <form id="settings-form" class="row">
          <div>
            <label class="label">Backend URL</label>
            <input id="backendUrl" class="field" placeholder="https://your-app.onrender.com" spellcheck="false" />
          </div>
          <div>
            <label class="label">Pairing Code</label>
            <input id="pairingCode" class="field" placeholder="123456" maxlength="6" />
          </div>
          <label style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #cbd5e1; cursor: pointer;">
            <input id="launchAtStartup" type="checkbox" />
            Launch connector when Windows starts
          </label>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="button primary" id="submitBtn" type="submit">Pair Connector</button>
            <button class="button secondary" id="closeButton" type="button">Minimize</button>
            <button class="button secondary" id="quitButton" type="button" style="color: #fca5a5;">Quit</button>
          </div>
          <div id="message"></div>
        </form>

        <div class="status">
          <div class="pill"><span>ID:</span><strong id="deviceId">...</strong></div>
          <div style="display: flex; justify-content: space-between;">
            <span>Connection:</span><strong id="connectorState" style="color: #fca5a5;">Disconnected</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span>TallyPrime:</span><strong id="tallyState" style="color: #fca5a5;">Not detected</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span>Active Co:</span><strong id="companyState" style="color: #93c5fd;">None</strong>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 11px; opacity: 0.7;">
            <span>Heartbeat:</span><span id="heartbeatState">Never</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      (async function () {
        const title = document.getElementById("main-title");
        const desc = document.getElementById("main-desc");
        const submitBtn = document.getElementById("submitBtn");
        const msg = document.getElementById("message");

        function updateUI(state) {
          document.getElementById("backendUrl").value = state.backendUrl || "";
          document.getElementById("launchAtStartup").checked = !!state.launchAtStartup;
          document.getElementById("deviceId").textContent = (state.deviceId || "").slice(0, 8) + "...";
          document.getElementById("connectorState").textContent = state.connectorConnected ? "Connected" : "Disconnected";
          document.getElementById("connectorState").style.color = state.connectorConnected ? "#4ade80" : "#fca5a5";
          document.getElementById("tallyState").textContent = state.tallyConnected ? "Online" : "Not detected";
          document.getElementById("tallyState").style.color = state.tallyConnected ? "#4ade80" : "#fca5a5";
          document.getElementById("companyState").textContent = state.tallyCompany || "No active company";
          document.getElementById("heartbeatState").textContent = state.lastHeartbeatAt ? new Date(state.lastHeartbeatAt).toLocaleTimeString() : "Never";

          if (state.paired) {
            title.textContent = "Connector Active";
            desc.textContent = "The connector is running and syncing data with TallyPrime.";
            submitBtn.textContent = "Update Settings";
          }
        }

        try {
          const state = await window.connectorApi.getState();
          updateUI(state);
        } catch (e) {
          console.error("Failed to load state", e);
        }

        // Live updates from main process via tray interactions or heartbeats
        setInterval(async () => {
          try {
            const state = await window.connectorApi.getState();
            updateUI(state);
          } catch (e) {}
        }, 5000);

        document.getElementById("settings-form").addEventListener("submit", async function (event) {
          event.preventDefault();
          msg.textContent = "Saving...";
          msg.className = "";
          try {
            const response = await window.connectorApi.saveSettings({
              backendUrl: document.getElementById("backendUrl").value,
              pairingCode: document.getElementById("pairingCode").value,
              launchAtStartup: document.getElementById("launchAtStartup").checked,
            });
            msg.textContent = response.message;
            if (response.ok) {
              msg.className = "success-text";
              const state = await window.connectorApi.getState();
              updateUI(state);
            }
          } catch (e) {
            msg.textContent = "Error: " + e.message;
          }
        });

        document.getElementById("closeButton").addEventListener("click", () => window.connectorApi.closeWindow());
        document.getElementById("quitButton").addEventListener("click", () => {
          if (confirm("Stop Tally sync and exit?")) window.connectorApi.quitApp();
        });
      })();
    </script>
  </body>
</html>
