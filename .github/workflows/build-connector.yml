name: Build Tally AI Connector

on:
  workflow_dispatch:
  push:
    tags:
      - 'connector-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: connector
        run: npm install

      - name: Build Windows installer (x64 + ia32)
        working-directory: connector
        run: npm run build:win

      - name: List build output
        working-directory: connector
        run: dir dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tally-ai-connector-windows
          path: |
            connector/dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: connector/dist/*.exe
          generate_release_notes: true
          body: |
            ## Tally AI Connector

            **Compatible with Windows 8.1, 10, and 11 (64-bit and 32-bit)**

            ### Installation
            1. Download the `.exe` installer below
            2. Run the installer — it will install and launch automatically
            3. Enter your backend URL and pairing code from the website Settings page
            4. Click **Pair Connector** — done!

            ### Requirements
            - TallyPrime must be running on the same Windows PC
            - Internet connection to reach the cloud workspace
